<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0E6C5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Семья">
<title>Активность в сети</title>
<style>
  :root{
    --bg:#F7F8FA; --card:#FFFFFF; --border:#E6E8EC;
    --text:#101317; --muted:#5B6472;
    --accent:#0E6C5F; --accent-soft:#E6F2F0;
    --red:#B23B31; --red-soft:#FBEAE8;
    --amber:#8A6A11; --amber-soft:#FFF7E6;
    color-scheme: light;
  }
  html{ color-scheme:light; background:var(--bg); }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:520px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--muted);margin-bottom:14px;}

  .segmented{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:12px;}
  .segmented button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .segmented button.active{background:var(--accent);color:#fff;}

  .toolbar{display:flex;gap:8px;margin-bottom:12px;}
  .btn{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:var(--accent);}
  .btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn.on{background:var(--accent);}
  .btn.off{background:var(--card);color:var(--muted);border:1px solid var(--border);}

  .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .tabs button{
    border:1px solid var(--border);background:var(--card);color:var(--muted);
    padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;
  }
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .domain{font-size:15px;font-weight:600;word-break:break-all;}
  .domain.flag{color:var(--red);}
  .meta{font-size:12px;color:var(--muted);margin-top:4px;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;}
  .badge.blocked{background:var(--red-soft);color:var(--red);}
  .badge.allowed{background:var(--accent-soft);color:var(--accent);}
  .flag-icon{color:var(--red);font-weight:700;margin-right:4px;}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0;}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 14px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;}
  .newsites{font-size:13px;padding:12px 14px;border-radius:10px;margin-bottom:14px;background:var(--amber-soft);color:var(--amber);line-height:1.5;}

  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  .search-row input{margin-bottom:0;}
  .search-row .btn{flex:0 0 auto;padding:11px 16px;}

  .rank{font-size:13px;color:var(--muted);width:20px;flex-shrink:0;text-align:right;}
  .summary-stats{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap;}
  .summary-stat{font-size:12px;color:var(--muted);}
  .summary-stat b{color:var(--text);}

  .stat-grid{display:flex;gap:10px;margin-bottom:12px;}
  .stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;}
  .stat-box .n{font-size:18px;font-weight:700;}
  .stat-box .l{font-size:11px;color:var(--muted);margin-top:2px;}

  .barrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .barrow .label{font-size:11px;color:var(--muted);width:34px;flex-shrink:0;text-align:right;}
  .barrow .track{flex:1;height:16px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .barrow .fill{height:100%;background:var(--accent);border-radius:6px;}
  .barrow .fill.hot{background:var(--red);}
  .barrow .val{font-size:11px;color:var(--muted);width:34px;flex-shrink:0;}

  .catrow{margin-bottom:12px;}
  .catrow .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .catrow .top b{font-weight:600;}
  .catrow .top span{color:var(--muted);}
  .catrow .track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
  .catrow .fill{height:100%;background:var(--accent);border-radius:99px;}

  .center-screen{padding-top:20vh;text-align:center;}
  .center-screen p{font-size:14px;color:var(--muted);line-height:1.5;}

  .toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--text);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;text-align:center;display:none;z-index:10;}
  .toast.show{display:block;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Загрузка…</div></div>
<div class="toast" id="toast"></div>

<script>
// --- заполните перед загрузкой на GitHub Pages ---
const WORKER_URL = 'https://nextdns-proxy.beibarys2897.workers.dev';
const TOKEN = 'kz9Fj3mQx7vLp2Wn8Rt5';
// ---------------------------------------------------

const ADULT_KEYWORDS = [
  'porn','xxx','xvideos','xnxx','pornhub','redtube','xhamster','brazzers',
  'onlyfans','chaturbate','livejasmin','hentai','camsoda','youporn',
  'spankbang','tube8','365porn','fapdungeon','xhcdn','rule34'
];
const KNOWN_DOMAINS_KEY = 'family-monitor-known-domains';
const SESSION_GAP_MIN = 3;
const AUTO_REFRESH_MS = 5 * 60 * 1000;

let currentFilter = 'all';
let currentView = 'log'; // log | summary | hours | categories
let currentPeriod = 'today'; // today | week | month
let searchQuery = '';
let rawLogs = [];
let statusTotals = null;   // from analytics/status
let domainTotals = [];     // from analytics/domains
let reasonTotals = [];     // from analytics/reasons
let newDomains = [];
let autoRefresh = false;
let autoTimer = null;

function isAdult(item){
  const domain = (item.domain || '').toLowerCase();
  const reasons = JSON.stringify(item.reasons || item.category || '').toLowerCase();
  return ADULT_KEYWORDS.some(k => domain.includes(k)) ||
         reasons.includes('porn') || reasons.includes('nudity') || reasons.includes('adult');
}

async function api(endpoint, params){
  const qs = new URLSearchParams({ token: TOKEN, endpoint, ...(params||{}) });
  const res = await fetch(`${WORKER_URL}?${qs.toString()}`);
  return res.json();
}

function fmtTime(ts){
  return new Date(ts).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function fmtDuration(ms){
  const mins = Math.round(ms / 60000);
  if(mins < 60) return `~${mins} мин`;
  return `~${Math.floor(mins/60)} ч ${mins%60} мин`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2500);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalize(item){
  return {
    domain: item.domain || item.name || item.query || '--',
    ts: item.timestamp || item.time || item.date || Date.now(),
    device: (item.device && (item.device.name || item.device.id)) || item.deviceName || 'Неизвестно',
    status: item.status || (item.blocked ? 'blocked' : 'allowed'),
    reasons: item.reasons || item.category || null,
  };
}

function periodRange(period){
  const now = new Date();
  const to = now.toISOString();
  let from;
  if(period === 'today'){ from = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString(); }
  else if(period === 'week'){ from = new Date(now - 7*86400000).toISOString(); }
  else { from = new Date(now - 30*86400000).toISOString(); }
  return { from, to };
}

// DNS logs only tell us WHEN a domain was queried, not how long a page stayed
// open. We approximate "time on site" by grouping a domain's queries into
// sessions (gap < SESSION_GAP_MIN counts as the same visit). This runs on
// whatever raw log sample we loaded, not the full period total.
function aggregateDomains(logs){
  const byDomain = {};
  logs.forEach(item => { (byDomain[item.domain] = byDomain[item.domain] || []).push(new Date(item.ts).getTime()); });
  return Object.keys(byDomain).map(domain => {
    const times = byDomain[domain].sort((a,b) => a-b);
    let totalMs = 0, sessions = 0, sessionStart = times[0], last = times[0];
    for(let i = 1; i < times.length; i++){
      if(times[i] - last > SESSION_GAP_MIN * 60000){
        totalMs += Math.max(last - sessionStart, 30000);
        sessions++;
        sessionStart = times[i];
      }
      last = times[i];
    }
    totalMs += Math.max(last - sessionStart, 30000);
    sessions++;
    return { domain, count: times.length, sessions, totalMs, lastSeen: times[times.length-1] };
  }).sort((a,b) => b.totalMs - a.totalMs);
}

function hourlyHistogram(logs){
  const buckets = new Array(24).fill(0);
  logs.forEach(item => buckets[new Date(item.ts).getHours()]++);
  return buckets;
}

function detectNewDomains(logs){
  let known = [];
  try{ known = JSON.parse(localStorage.getItem(KNOWN_DOMAINS_KEY) || '[]'); }catch(e){ known = []; }
  const knownSet = new Set(known);
  const firstEverRun = known.length === 0;
  const seenNow = [...new Set(logs.map(l => l.domain))];
  const fresh = firstEverRun ? [] : seenNow.filter(d => !knownSet.has(d));
  const merged = [...new Set([...known, ...seenNow])].slice(-3000); // cap growth
  try{ localStorage.setItem(KNOWN_DOMAINS_KEY, JSON.stringify(merged)); }catch(e){}
  return fresh;
}

async function load(){
  const app = document.getElementById('app');
  if(WORKER_URL.includes('ВАШ') || !WORKER_URL.startsWith('https://')){
    app.innerHTML = `<div class="center-screen"><p>Впишите свой WORKER_URL и TOKEN в начало файла перед загрузкой на GitHub Pages.</p></div>`;
    return;
  }
  try{
    const range = periodRange(currentPeriod);
    // 1000 wasn't a NextDNS limit -- that number was just what this code
    // asked for. Raised it, but see the note in the reply about what this
    // does and doesn't fix.
    const [logsRes, statusRes, domainsRes, reasonsRes] = await Promise.all([
      api('logs', {limit: 20000, from: range.from}),
      api('analytics/status', {from: range.from, to: range.to}),
      api('analytics/domains', {from: range.from, to: range.to}),
      api('analytics/reasons', {from: range.from, to: range.to}),
    ]);

    const list = logsRes.data || logsRes.logs || logsRes.result || (Array.isArray(logsRes) ? logsRes : []);
    rawLogs = list.map(normalize).sort((a,b) => new Date(b.ts) - new Date(a.ts));

    statusTotals = (statusRes.data || []).reduce((acc, s) => { acc[s.status] = s.queries; return acc; }, {});
    domainTotals = (domainsRes.data || []).map(d => ({ domain: d.domain || d.name || d.id, queries: d.queries }))
                     .sort((a,b) => b.queries - a.queries);
    reasonTotals = (reasonsRes.data || []).map(r => ({ name: r.name || r.id, queries: r.queries }))
                     .sort((a,b) => b.queries - a.queries);

    newDomains = detectNewDomains(rawLogs);
    render();
  }catch(e){
    app.innerHTML = `<div class="center-screen"><p>Не удалось загрузить данные. Проверьте WORKER_URL, токен и API-ключ NextDNS.</p></div>`;
  }
}

function buildShareText(){
  const total = Object.values(statusTotals||{}).reduce((a,b)=>a+b,0);
  const blocked = (statusTotals && statusTotals.blocked) || 0;
  const periodLabel = {today:'сегодня', week:'за 7 дней', month:'за 30 дней'}[currentPeriod];
  const topSites = domainTotals.slice(0,5).map((d,i)=>`${i+1}. ${d.domain} -- ${d.queries}`).join('\n');
  const adultCount = rawLogs.filter(isAdult).length;
  return `Отчёт по интернет-активности (${periodLabel}):\n\n` +
    `Всего запросов: ${total}\nЗаблокировано: ${blocked}\n${adultCount ? `⚠️ Взрослый контент: ${adultCount} записей в журнале\n` : ''}` +
    (topSites ? `\nТоп сайтов:\n${topSites}` : '') +
    (newDomains.length ? `\n\nНовые сайты: ${newDomains.join(', ')}` : '');
}

async function onShare(){
  const text = buildShareText();
  if(navigator.share){
    try{ await navigator.share({ title: 'Отчёт по интернет-активности', text }); }catch(e){ /* cancelled */ }
  }else if(navigator.clipboard){
    await navigator.clipboard.writeText(text);
    showToast('Отчёт скопирован -- вставьте в сообщение');
  }else{
    showToast('Поделиться не поддерживается в этом браузере');
  }
}

function toggleAutoRefresh(){
  autoRefresh = !autoRefresh;
  if(autoRefresh){ autoTimer = setInterval(load, AUTO_REFRESH_MS); showToast('Автообновление включено (каждые 5 мин)'); }
  else { clearInterval(autoTimer); showToast('Автообновление выключено'); }
  render();
}

function render(){
  const app = document.getElementById('app');
  const periodLabel = {today:'сегодня', week:'7 дней', month:'30 дней'}[currentPeriod];

  const header = `
    <h1>Активность в сети</h1>
    <div class="sub">${periodLabel} · обновлено ${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>

    <div class="segmented">
      <button class="${currentPeriod==='today'?'active':''}" data-p="today">Сегодня</button>
      <button class="${currentPeriod==='week'?'active':''}" data-p="week">7 дней</button>
      <button class="${currentPeriod==='month'?'active':''}" data-p="month">30 дней</button>
    </div>

    <div class="toolbar">
      <button class="btn" id="refreshBtn">Обновить</button>
      <button class="btn ${autoRefresh?'on':'off'}" id="autoBtn">${autoRefresh?'⏱ Авто вкл':'⏱ Авто выкл'}</button>
      <button class="btn btn-secondary" id="shareBtn">Поделиться</button>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Поиск по названию сайта, например: 365" value="${escapeHtml(searchQuery)}">
      ${searchQuery ? `<button class="btn btn-secondary" id="clearSearchBtn">✕</button>` : ''}
    </div>

    ${newDomains.length ? `<div class="newsites">🆕 Новые сайты с прошлой проверки: ${newDomains.map(escapeHtml).join(', ')}</div>` : ''}
  `;

  let body = '';

  if(searchQuery){
    const q = searchQuery.toLowerCase();
    const matches = rawLogs.filter(i => i.domain.toLowerCase().includes(q));
    const byDomain = aggregateDomains(matches);
    body = `
      <div class="sub">Найдено: ${matches.length} записей · ${byDomain.length} сайт(ов)</div>
      ${byDomain.length ? byDomain.map(d => `
        <div class="card">
          <div class="domain ${isAdult({domain:d.domain})?'flag':''}">${isAdult({domain:d.domain})?'<span class="flag-icon">⚠️</span>':''}${escapeHtml(d.domain)}</div>
          <div class="summary-stats">
            <div class="summary-stat">заходов: <b>${d.count}</b></div>
            <div class="summary-stat">в среднем за заход: <b>${fmtDuration(d.totalMs / d.sessions)}</b></div>
            <div class="summary-stat">последний раз: <b>${fmtTime(d.lastSeen)}</b></div>
          </div>
        </div>
      `).join('') : ''}
      <div class="note">Все записи по запросу «${escapeHtml(searchQuery)}»:</div>
      ${matches.length ? matches.map(i => `
        <div class="card">
          <div class="row">
            <div>
              <div class="domain ${isAdult(i)?'flag':''}">${isAdult(i)?'<span class="flag-icon">⚠️</span>':''}${escapeHtml(i.domain)}</div>
              <div class="meta">${fmtTime(i.ts)} · ${escapeHtml(i.device)}</div>
            </div>
            <div class="badge ${i.status==='blocked'?'blocked':'allowed'}">${i.status==='blocked'?'заблокировано':'разрешено'}</div>
          </div>
        </div>
      `).join('') : `<div class="empty">Ничего не найдено по «${escapeHtml(searchQuery)}»</div>`}
    `;
    app.innerHTML = header + body;
    document.getElementById('refreshBtn').onclick = load;
    document.getElementById('autoBtn').onclick = toggleAutoRefresh;
    document.getElementById('shareBtn').onclick = onShare;
    document.getElementById('searchInput').oninput = (e) => { searchQuery = e.target.value; render(); };
    document.getElementById('searchInput').focus();
    document.getElementById('searchInput').setSelectionRange(searchQuery.length, searchQuery.length);
    const clearBtn = document.getElementById('clearSearchBtn');
    if(clearBtn) clearBtn.onclick = () => { searchQuery = ''; render(); };
    document.querySelectorAll('.segmented button').forEach(b => b.onclick = () => { currentPeriod = b.dataset.p; load(); });
    return;
  }

  header += `
    <div class="tabs">
      <button class="${currentView==='log'?'active':''}" data-v="log">Журнал</button>
      <button class="${currentView==='summary'?'active':''}" data-v="summary">Топ сайтов</button>
      <button class="${currentView==='hours'?'active':''}" data-v="hours">По часам</button>
      <button class="${currentView==='categories'?'active':''}" data-v="categories">Категории</button>
    </div>
  `;

  if(currentView === 'summary'){
    const total = Object.values(statusTotals||{}).reduce((a,b)=>a+b,0);
    const timeEst = aggregateDomains(rawLogs);
    const timeByDomain = {};
    timeEst.forEach(t => timeByDomain[t.domain] = t);

    body = `
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${total || rawLogs.length}</div><div class="l">всего запросов</div></div>
        <div class="stat-box"><div class="n">${(statusTotals && statusTotals.blocked) || rawLogs.filter(i=>i.status==='blocked').length}</div><div class="l">заблокировано</div></div>
        <div class="stat-box"><div class="n">${rawLogs.filter(isAdult).length}</div><div class="l">⚠️ взрослый контент</div></div>
      </div>
      <div class="note">Счётчик заходов -- точные данные NextDNS за выбранный период. Время на сайте -- оценка по загруженному журналу (не по всему периоду для 7/30 дней).</div>
      ${domainTotals.length ? domainTotals.slice(0, 30).map((d, idx) => `
        <div class="card">
          <div class="row">
            <div class="rank">${idx+1}</div>
            <div style="flex:1;">
              <div class="domain ${isAdult({domain:d.domain})?'flag':''}">${isAdult({domain:d.domain})?'<span class="flag-icon">⚠️</span>':''}${escapeHtml(d.domain)}</div>
              <div class="summary-stats">
                <div class="summary-stat">заходов: <b>${d.queries}</b></div>
                ${timeByDomain[d.domain] ? `<div class="summary-stat">время: <b>${fmtDuration(timeByDomain[d.domain].totalMs)}</b></div>` : ''}
              </div>
            </div>
          </div>
        </div>
      `).join('') : `<div class="empty">Нет данных за этот период</div>`}
    `;
  } else if(currentView === 'hours'){
    const buckets = hourlyHistogram(rawLogs);
    const max = Math.max(1, ...buckets);
    const peakHour = buckets.indexOf(max);
    body = `
      <div class="note">По журналу за загруженный период (${rawLogs.length} записей) -- пик активности: ${String(peakHour).padStart(2,'0')}:00–${String((peakHour+1)%24).padStart(2,'0')}:00.</div>
      <div class="card">
        ${buckets.map((v, h) => `
          <div class="barrow">
            <div class="label">${String(h).padStart(2,'0')}:00</div>
            <div class="track"><div class="fill ${h>=23||h<6?'hot':''}" style="width:${(v/max*100)}%"></div></div>
            <div class="val">${v}</div>
          </div>
        `).join('')}
      </div>
      <div class="note">Красным -- «тихие часы» (23:00–06:00), стоит обратить внимание, если там есть активность.</div>
    `;
  } else if(currentView === 'categories'){
    const total = reasonTotals.reduce((s,r)=>s+r.queries, 0) || 1;
    body = `
      <div class="note">Причины блокировок за период -- по каким категориям (трекеры, реклама, взрослый контент и т.д.) чаще всего срабатывает блокировка NextDNS.</div>
      <div class="card">
        ${reasonTotals.length ? reasonTotals.slice(0, 15).map(r => `
          <div class="catrow">
            <div class="top"><b>${escapeHtml(r.name)}</b><span>${r.queries} (${Math.round(r.queries/total*100)}%)</span></div>
            <div class="track"><div class="fill" style="width:${Math.round(r.queries/reasonTotals[0].queries*100)}%"></div></div>
          </div>
        `).join('') : `<div class="empty">Нет заблокированных категорий за этот период</div>`}
      </div>
    `;
  } else {
    let items = rawLogs;
    if(currentFilter === 'blocked') items = items.filter(i => i.status === 'blocked');
    if(currentFilter === 'adult') items = items.filter(isAdult);
    body = `
      <div class="tabs">
        <button class="${currentFilter==='all'?'active':''}" data-f="all">Все (${rawLogs.length})</button>
        <button class="${currentFilter==='blocked'?'active':''}" data-f="blocked">Заблокированные (${rawLogs.filter(i=>i.status==='blocked').length})</button>
        <button class="${currentFilter==='adult'?'active':''}" data-f="adult">⚠️ Взрослый контент (${rawLogs.filter(isAdult).length})</button>
      </div>
      ${items.length ? items.map(i => `
        <div class="card">
          <div class="row">
            <div>
              <div class="domain ${isAdult(i)?'flag':''}">${isAdult(i)?'<span class="flag-icon">⚠️</span>':''}${escapeHtml(i.domain)}</div>
              <div class="meta">${fmtTime(i.ts)} · ${escapeHtml(i.device)}</div>
            </div>
            <div class="badge ${i.status==='blocked'?'blocked':'allowed'}">${i.status==='blocked'?'заблокировано':'разрешено'}</div>
          </div>
        </div>
      `).join('') : `<div class="empty">Ничего не найдено по этому фильтру</div>`}
    `;
  }

  app.innerHTML = header + body;

  document.getElementById('refreshBtn').onclick = load;
  document.getElementById('autoBtn').onclick = toggleAutoRefresh;
  document.getElementById('shareBtn').onclick = onShare;
  document.getElementById('searchInput').oninput = (e) => { searchQuery = e.target.value; render(); };
  document.querySelectorAll('.segmented button').forEach(b => b.onclick = () => { currentPeriod = b.dataset.p; load(); });
  document.querySelectorAll('.tabs button[data-v]').forEach(b => b.onclick = () => { currentView = b.dataset.v; render(); });
  document.querySelectorAll('.tabs button[data-f]').forEach(b => b.onclick = () => { currentFilter = b.dataset.f; render(); });
}

load();
</script>
</body>
</html>
